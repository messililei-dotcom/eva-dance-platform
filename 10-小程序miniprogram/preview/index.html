<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>伊娃东方舞小程序模拟器</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="shortcut icon" href="../favicon.png">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#eef1f6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#202124}
    .shell{min-height:100vh;display:grid;place-items:center;padding:14px}
    .phone{width:390px;max-width:100%;height:min(844px,calc(100vh - 28px));background:#f6f7f9;border:8px solid #111;border-radius:36px;box-shadow:0 22px 70px rgba(25,32,46,.2);overflow:hidden;position:relative}
    .status{height:28px;display:flex;align-items:end;justify-content:space-between;padding:0 18px 5px;font-size:11px;font-weight:700;background:#fff}
    .nav{height:42px;display:flex;align-items:center;justify-content:center;background:#fff;border-bottom:1px solid #eceff3;font-size:17px;font-weight:900;position:relative}
    .nav-icon{position:absolute;top:7px;border:0;background:transparent;color:#202124;font-size:22px;line-height:1}
    .nav-icon.left{left:12px}.nav-icon.search{right:50px}.nav-icon.share{right:14px;font-size:21px}
    .page{position:absolute;top:70px;bottom:58px;left:0;right:0;overflow:auto;padding:8px 10px 72px}
    .tabbar{position:absolute;left:0;right:0;bottom:0;height:58px;background:rgba(255,255,255,.98);border-top:1px solid #e7ebf0;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:4px 2px 6px}
    .tabbar button{border:0;background:transparent;color:#858c96;font-size:10px;line-height:1.12;min-height:46px;border-radius:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
    .tabbar button.active{color:#f05b46}
    .tab-icon{width:22px;height:22px;display:grid;place-items:center}
    .tab-icon img{width:21px;height:21px;display:block;object-fit:contain}
    .card{background:#fff;border-radius:8px;box-shadow:0 4px 14px rgba(32,33,36,.04);border:1px solid rgba(32,33,36,.05)}
    .live-profile{display:grid;grid-template-columns:58px minmax(0,1fr) 76px;gap:10px;align-items:center;padding:16px 4px 10px;background:#fff;margin:-14px -14px 0;padding-left:14px;padding-right:14px}
    .live-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,#252832,#737b8c);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900;position:relative}
    .live-avatar:after{content:"V";position:absolute;right:-2px;bottom:0;width:18px;height:18px;border-radius:50%;background:#f2c94c;color:#fff;display:grid;place-items:center;font-size:11px;border:2px solid #fff}
    .live-name{font-size:19px;font-weight:900;line-height:1.22;margin-bottom:4px}
    .live-meta{color:#8d8d8d;font-size:16px;font-weight:700}
    .cert{border:0;border-radius:999px;background:#ececec;color:#fff;padding:10px 12px;font-weight:900;font-size:15px}
    .banner-strip{display:flex;gap:8px;overflow:hidden;margin:0 -10px 2px;padding-left:10px}
    .banner{min-width:306px;height:108px;border-radius:8px;overflow:hidden;position:relative;color:#fff;background:linear-gradient(135deg,#121a42,#4066df 64%,#7fc7d7);box-shadow:0 6px 16px rgba(28,45,119,.13)}
    .banner:before{content:"";position:absolute;left:-24px;bottom:-36px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#f6d7c7 0 16%,#c28a7d 17% 28%,transparent 29%)}
    .banner-copy{position:absolute;left:16px;top:11px;right:16px;text-align:center}
    .brand-label{position:absolute;left:16px;top:58px;color:#ffe1ac;font-size:13px;font-weight:800}
    .banner h3{font-size:34px;line-height:.9;margin:18px 0 2px;text-shadow:0 3px 10px rgba(0,0,0,.2)}
    .banner p{margin:0;font-size:12px;color:#ffe1ac;font-weight:800}
    .banner small{font-size:11px}
    .banner.next{min-width:56px;background:linear-gradient(145deg,#e2f8ff,#83c9d9);opacity:.82}
    .dots{display:flex;justify-content:center;gap:6px;margin:-9px 0 7px;position:relative;z-index:1}
    .dots span{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.72);box-shadow:0 0 0 1px rgba(0,0,0,.04)}
    .dots span.active{width:20px;background:#fff}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:12px 2px 6px}
    .section-head h2{margin:0;font-size:18px}
    .section-head small{display:block;margin-top:2px;color:#9aa1aa;font-size:11px;font-weight:700}
    .section-head button{border:0;background:transparent;color:#9aa1aa;font-size:13px;font-weight:800;padding:0}
    .hero{padding:13px;background:linear-gradient(145deg,#303544,#4b5264);color:#fff;border-radius:10px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between}
    .hero small{color:#ffd8cf;font-weight:800}
    .hero h1{font-size:19px;line-height:1.2;margin:6px 0;letter-spacing:0}
    .hero p{margin:0;color:#f5f2ef;font-size:12px;line-height:1.45}
    .hero-actions{display:grid;grid-template-columns:1.1fr .9fr;gap:8px;margin-top:12px}
    .pill{border:0;border-radius:999px;background:#ff5b45;color:#fff;padding:8px 10px;font-weight:900;font-size:12px}
    .pill.light{background:#fff;color:#f05b46}
    .stats,.system-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:8px 0;padding:10px 4px;text-align:center}
    .stats b,.system-grid b{display:block;color:#f05b46;font-size:17px}
    .stats span,.system-grid span{font-size:11px;color:#8a8f99}
    h2{font-size:16px;margin:13px 2px 7px;letter-spacing:0}
    .intro{padding:15px;margin-bottom:10px}
    .intro h3,.lesson-info h3{font-size:20px;margin:0 0 8px}
    .muted{color:#7e8591;font-size:11px;line-height:1.42}
    .tag{display:inline-flex;padding:5px 10px;border-radius:999px;background:rgba(240,91,70,.1);color:#f05b46;font-size:13px;font-weight:900}
    .lesson{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:9px;margin-bottom:7px}
    .num{width:28px;height:28px;border-radius:50%;background:rgba(240,91,70,.1);color:#f05b46;display:grid;place-items:center;font-weight:900;font-size:11px}
    .num.done{background:#eff8f2;color:#38a169}
    .lesson-info b{display:block;font-size:13px;line-height:1.32}
    .progress{height:5px;background:#eef0f4;border-radius:999px;overflow:hidden;margin-top:5px}
    .progress i{display:block;height:100%;background:#f05b46;border-radius:999px}
    .done-text{font-weight:900;color:#38a169;font-size:11px;white-space:nowrap}
    .todo-text{font-weight:900;color:#f05b46;font-size:11px;white-space:nowrap}
    .btn{min-height:44px;border:0;border-radius:999px;background:#f05b46;color:#fff;font-weight:900;padding:0 16px}
    .btn.ghost{background:#fff;color:#f05b46;border:1px solid rgba(240,91,70,.28)}
    .series{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;min-height:74px;margin-bottom:8px;overflow:hidden}
    .cover{width:74px;aspect-ratio:1/1;background:#343a48;color:#ffd8cf;display:grid;place-items:center;font-weight:900;text-align:center;padding:7px;font-size:12px}
    .live-series{display:grid;grid-template-columns:76px minmax(0,1fr);gap:9px;padding:8px 0;border-bottom:1px solid #eef1f4;background:#fff}
    .live-cover{width:76px;aspect-ratio:1/1;border-radius:7px;background:linear-gradient(145deg,#2f3b40,#b37a3d);color:#fff;display:grid;place-items:center;text-align:center;font-weight:900;padding:7px;position:relative;overflow:hidden;font-size:12px}
    .live-cover:after{content:"";position:absolute;inset:auto -20px -28px auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.18)}
    .live-rank{position:absolute;left:5px;top:5px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.92);color:#f05b46;display:grid;place-items:center;font-size:10px;font-weight:900}
    .live-meta-line{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:#7e8591;font-size:11px;line-height:1.2;font-weight:700}
    .live-meta-line span{white-space:nowrap}
    .info{padding:8px;flex:1}
    .live-info{padding-right:2px}
    .info b,.live-info b{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .row{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:7px}
    .live-row{display:block;margin-top:6px}
    .live-row .muted{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .live-price{display:flex;white-space:nowrap;justify-content:space-between;align-items:baseline;margin-top:6px;gap:7px}
    .old-price{color:#b8b8b8;text-decoration:line-through;font-size:11px}
    .price{color:#f05b46;font-weight:900;font-size:13px}
    .course-progress{display:flex;align-items:center;gap:6px;margin-top:6px}
    .course-progress .progress{flex:1;margin:0}
    .course-progress span{color:#8a8f99;font-size:10px;font-weight:800;white-space:nowrap}
    .back{position:absolute;left:16px;border:0;background:transparent;font-size:22px}
    .detail-cover{width:105px;height:105px;border-radius:8px;background:linear-gradient(145deg,#343a48,#ba7e50);color:#ffd8cf;display:grid;place-items:center;font-size:20px;font-weight:900;overflow:hidden}
    .detail-cover img,.detail-cover .mini-fallback{width:105px;height:105px;border-radius:8px;object-fit:cover;display:block}
    .detail-card{display:grid;grid-template-columns:105px minmax(0,1fr);gap:12px;align-items:start;min-height:127px;padding:11px;position:relative}
    .detail-info h2{margin:0 0 8px;font-size:16px;line-height:1.3}
    .detail-info .muted{margin:0 0 7px}
    .detail-info .row{margin-top:12px}
    .detail-desc{padding:10px;margin:8px 0;color:#5d6673;font-size:12px;line-height:1.5}
    .detail-desc b{display:block;color:#202124;font-size:14px;margin-bottom:5px}
    .source-note{display:inline-flex;margin-top:7px;color:#9aa1aa;font-size:10px;font-weight:800}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);margin:8px 0;background:#fff;border-radius:8px;overflow:hidden}
    .tabs button{border:0;background:#fff;padding:8px;font-size:12px}
    .tabs .active{background:#f05b46;color:#fff;font-weight:900}
    .profile-head{position:relative;display:flex;align-items:center;gap:10px;padding:17px 106px 9px 4px}
    .profile-actions{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:5px}
    .avatar{width:48px;height:48px;border-radius:8px;background:#f05b46;color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900;overflow:hidden;box-shadow:0 2px 6px rgba(255,91,69,.16)}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:8px}
    .profile-name{font-size:19px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-phone{margin-top:4px;color:#8c8172;font-size:13px}
    .profile-auth-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:6px 14px;background:linear-gradient(135deg,#c8a96e,#8b1a1a);color:#fff;font-size:13px;font-weight:600;border-radius:12px;border:0;white-space:nowrap}
    .profile-bind-btn,.profile-logout-btn{border:0;border-radius:12px;white-space:nowrap;padding:6px 10px;font-size:12px;font-weight:700}.profile-bind-btn{background:#1aad19;color:#fff}.profile-logout-btn{background:#f5f5f5;color:#999}
    .wechat-card{padding:12px}.wechat-title{font-size:16px;font-weight:900;color:#202124}.wechat-desc{margin-top:6px;color:#8c8172;font-size:12px;font-weight:800;line-height:1.45}.wechat-form{display:grid;grid-template-columns:minmax(0,1fr) 1fr;gap:8px;margin-top:10px}.wechat-input{height:40px;border:1px solid #f0e6da;border-radius:8px;background:#fffaf4;color:#202124;font-size:13px;padding:0 10px}.sync-btn{height:40px;border:0;border-radius:8px;background:#ff5b45;color:#fff;font-size:14px;font-weight:900}
    .address-card{padding:6px 10px}.address-title{font-size:13px;font-weight:800;color:#202124;margin-bottom:5px}.address-row{display:flex;gap:8px}.address-field-half{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#f5f6f8;border-radius:6px;padding:3px 8px;min-height:32px}
    .certificate-empty{padding:18px 14px;color:#8c8172;font-size:13px;text-align:center}.certificate-list{overflow:hidden}.certificate-item{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid #f1f1f1}.certificate-item:last-child{border-bottom:0}.certificate-title{font-size:13px;font-weight:900;color:#202124}.certificate-sub{margin-top:4px;color:#8c8172;font-size:11px}
    .login-container{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:34px 18px 20px;background:#fff}
    .logo-section{text-align:center;padding-top:20px}
    .logo-mark{width:74px;height:74px;margin:0 auto 13px;border-radius:24px;background:linear-gradient(145deg,#2d3037,#c45d45);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;box-shadow:0 12px 28px rgba(196,93,69,.18)}
    .login-logo{width:74px;height:74px;margin:0 auto 13px;border-radius:24px;display:block;object-fit:contain;box-shadow:0 12px 28px rgba(196,93,69,.18)}
    .login-title{font-size:24px;font-weight:900}
    .login-subtitle{margin-top:6px;color:#8a8f99;font-size:13px;font-weight:800}
    .form-section{display:grid;gap:14px;margin-top:24px}
    .input-group{display:grid;gap:7px}
    .input-label{font-size:13px;font-weight:900;color:#202124}
    .input,.code-input{width:100%;height:44px;border:1px solid #e4e7ec;border-radius:10px;background:#f8f9fb;padding:0 12px;font-size:15px;outline:none}
    .code-row{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px}
    .code-btn{height:44px;border:0;border-radius:10px;background:#fff2ef;color:#f05b46;font-size:12px;font-weight:900;white-space:nowrap;padding:0 10px}
    .login-btn{height:48px;border:0;border-radius:999px;background:#f05b46;color:#fff;font-size:16px;font-weight:900;line-height:48px;text-align:center;padding:0}
    .hint{text-align:center;color:#8a8f99;font-size:12px}
    .back-login{border:0;background:transparent;color:#8a8f99;font-size:13px;font-weight:900}
    .menu{overflow:hidden}
    .menu div,.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;border:0;border-bottom:1px solid #f1f1f1;background:#fff;color:#202124;font:inherit;text-align:left}
    .menu div:last-child,.menu button:last-child{border-bottom:0}
    .empty{padding:28px;text-align:center;color:#8a8f99}
    .training-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-bottom:10px;padding:4px;border-radius:9px;background:#fff;border:1px solid rgba(32,33,36,.06)}.training-tab{height:34px;border:0;border-radius:7px;background:transparent;color:#6f7782;font-size:14px;font-weight:900;text-decoration:none;display:grid;place-items:center}.training-tab.active{color:#fff;background:#ff5b45}
    .practice-hero{padding:19px 16px 15px;border-radius:9px;color:#fff;background:linear-gradient(135deg,#3b2830 0%,#aa5242 56%,#df8f54 100%)}
    .practice-label{display:inline-flex;padding:4px 8px;border-radius:999px;color:#ffe7c8;background:rgba(255,255,255,.14);font-size:12px;font-weight:800}
    .practice-hero-title{margin-top:18px;font-size:26px;font-weight:900}
    .practice-hero-desc{margin-top:7px;color:rgba(255,255,255,.78);font-size:13.5px;line-height:1.55}
    .practice-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.practice-stat{padding:9px;border-radius:7px;background:rgba(255,255,255,.12)}.practice-stat-val{display:block;font-size:18px;font-weight:900}.practice-stat-lbl{display:block;margin-top:3px;color:rgba(255,255,255,.68);font-size:11.5px}
    .practice-section-head{display:flex;align-items:center;justify-content:space-between;margin:17px 0 8px;font-size:19px;font-weight:800}.practice-section-head small{color:#b8b8b8;font-size:14px;font-weight:500}
    .practice-card{display:grid;grid-template-columns:73px 1fr;gap:12px;padding:15px;border-radius:9px;background:#fff7ef;border:1px solid rgba(181,117,76,.16)}
    .practice-ring{width:66px;height:66px;border-radius:50%;display:grid;place-content:center;color:#fff;background:#ff5b45;border:5px solid #f3d7bd;text-align:center}.practice-ring span{display:block}.practice-ring-min{font-size:19px;font-weight:900}.practice-ring-unit{font-size:11px;font-weight:700}
    .practice-tag{display:inline-flex;max-width:90px;padding:4px 7px;border-radius:999px;color:#a44d39;background:rgba(255,91,69,.1);font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .practice-title-lg{margin-top:5px;color:#202124;font-size:17px;font-weight:900}
    .practice-desc{margin-top:5px;color:#7c7065;font-size:13.5px;line-height:1.55}
    .practice-steps{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.practice-step{padding:4px 7px;border-radius:999px;color:#6f665d;background:#fff;font-size:11.5px;font-weight:700}
    .practice-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
    .ghost-btn{height:38px;border:1px solid rgba(255,91,69,.25);border-radius:999px;background:#fff;color:#ff5b45;font-size:13px;font-weight:900}
    .week-card{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:11px}.week-item{display:grid;justify-items:center;gap:5px}.week-dot{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;color:#8c8172;background:#f4eee8;font-size:12px;font-weight:900}.week-dot.done{color:#fff;background:#ff5b45}.week-label{color:#8c8172;font-size:11px}

      const isImageKey = key => key.indexOf('image') >= 0

          return '/api/course/series/cover/' + filename;
        }
        if (source.indexOf('/uploads/') === 0) return '/api/course/cover-image?src=' + encodeURIComponent(source);
        return source;
      };
      const normalizeAsset = (url, key) => {
        if (!url || typeof url !== 'string') return url;
        let trimmed = url.trim();
        if (!trimmed) return '';
        if (isImageKey(key) && /^https?:\/\/admin\.dongfangwuquan\.com\//i.test(trimmed)) {
          const path = trimmed.replace(/^https?:\/\/admin\.dongfangwuquan\.com/i, '');
          const normalizedPath = normalizeImagePath(path);
          if (normalizedPath.indexOf('/api/course/') === 0) return withOrigin(normalizedPath);
        }
        if ((trimmed.indexOf('/api/course/') === 0 || trimmed.indexOf('/api/courses/') === 0) && isImageKey(key)) return withOrigin(trimmed);
        if ((trimmed.startsWith('/api/') || apiAssetPattern.test(trimmed)) && isImageKey(key)) return '';
        if (/^https?:\/\//.test(trimmed)) return trimmed;
        if (trimmed.startsWith('//')) return 'https:' + trimmed;
        if (isImageKey(key)) {
          const normalizedPath = normalizeImagePath(trimmed);
          if (normalizedPath.indexOf('/api/course/') === 0) return withOrigin(normalizedPath);
        }
        if (trimmed.startsWith('/official-images/') || trimmed.startsWith('/api/') || trimmed.startsWith('/static/')) return origin + trimmed;
        return trimmed;
      };

      if (Array.isArray(value)) return value.map(item => normalizeAssets(item, apiBase));
      if (value && typeof value === 'object') {
        const next = {};
        Object.keys(value).forEach(key => {
          next[key] = isAssetKey(key)

    const popularityBaseBySeed = {};

    function stablePopularityBase(seed){
      if (popularityBaseBySeed[seed] !== undefined) return popularityBaseBySeed[seed];

      let hash = 0;
      for (let index = 0; index < seed.length; index += 1) {
        hash = (hash * 31 + seed.charCodeAt(index)) >>> 0;
      }

      let base = MIN_POPULARITY_BASE + (hash % POPULARITY_BASE_RANGE);
      for (let offset = 0; offset < POPULARITY_BASE_RANGE; offset += 1) {
        if (!usedPopularityBases[base] || usedPopularityBases[base] === seed) {

          return base;

          id: item.id,

      let hash = 0;

      }
      return 18 + (hash % 73);
    }

      const levelText = formatMemberLevel(member.level);
      const avatarHtml = member.wx_avatar_url || member.avatar_url ? '<img src="' + escapeHtml(member.wx_avatar_url || member.avatar_url) + '" alt="">' : escapeHtml(displayName.slice(0, 1) || '伊');
      const certificateHtml = certificates.length ? '<section class="certificate-list card">' + certificates.map(cert => '<div class="certificate-item"><div><div class="certificate-title">' + escapeHtml(cert.courseName || cert.course_name || cert.name || '结业证书') + '</div><div class="certificate-sub">' + escapeHtml(formatDate(cert.issueDate || cert.issue_date)) + ' · ' + escapeHtml(cert.certificateNo || cert.certificate_no || '') + '</div></div><span class="menu-value">查看</span></div>').join('') + '</section>' : '<section class="certificate-empty card">暂无证书</section>';
      const profileActions = isLoggedIn ? '<div class="profile-actions"><button class="profile-bind-btn" onclick="bindWechatPreview()">绑定微信</button><button class="profile-logout-btn" data-action="logout">退出</button></div>' : '<button class="profile-auth-btn" data-action="login">登录</button>';
      setContent('<section class="profile-head"><div class="avatar">' + avatarHtml + '</div><div class="profile-main"><div class="profile-name">' + escapeHtml(displayName) + '</div><div class="profile-phone">' + escapeHtml(displayPhone) + '</div></div>' + profileActions + '</section><section class="stats card"><div><b>' + escapeHtml(levelText) + '</b><span>学员等级</span></div><div><b>' + (stats.authorized_count || 0) + '</b><span>关注训练</span></div><div><b>' + (stats.learning_count || 0) + '</b><span>练习记录</span></div><div><b>' + (stats.completion_rate || 0) + '%</b><span>完成率</span></div></section>' + (recent.length ? '<div class="section-title">最近练习</div><section class="menu card">' + recent.slice(0, 4).map(item => '<div><b>' + (item.series_name || item.course_name || '练习') + '</b><span>' + (item.completed ? '已完成' : '练习中') + '</span></div>').join('') + '</section>' : '') + '<section class="menu card">' + '<div id="profileEdit"><b>个人资料</b><span>编辑 ›</span></div>' + '<div id="certificatesPage"><b>我的证书</b><span>' + (certificates.length || 0) + ' 张 ›</span></div>' + adminEntry + '<div><b>字体设置</b><span>标准</span></div><div><b>我的分销</b><span>邀请好友</span></div><div><b>笔记</b><span>' + (stats.order_count || 0) + ' 笔</span></div><button data-action="wechat-service"><b>联系客服</b><span>微信客服</span></button></section>');
    }
    function renderLogin(){
      nav('手机号登录', true);
      document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'));
      setContent('<section class="login-container"><div><div class="logo-section"><img class="login-logo" src="../images/logo-20261005.png" alt="伊娃东方舞"><div class="login-title">伊娃东方舞</div><div class="login-subtitle">舞者成长系统</div></div><div class="form-section"><button class="login-btn" style="background:#1aad19" data-action="phone-auth-login">手机一键登陆</button></div></div><button class="back-login" data-action="profile">返回个人中心</button></section>');
    }
    async function loginPreviewByPhoneAuth(){
      const phone = '13900000000';
      simulatedMember = { id: 999, name: '伊娃学员', phone };
      localStorage.setItem('evaMiniPreviewMember', JSON.stringify(simulatedMember));
      profileData = await api('/member/profile?phone=' + encodeURIComponent(phone)).catch(() => null);
      renderProfile();
    }
    function logoutPreview(){
      simulatedMember = null;
      localStorage.removeItem('evaMiniPreviewMember');
      renderProfile();
    }
    function bindWechatPreview(){
      if (!simulatedMember && !profileData?.member && !miniRuntimeConfig.memberId) {
        renderLogin();
        return;
      }
      const member = profileData?.member || simulatedMember || { id: miniRuntimeConfig.memberId || 999, phone: '13900000000' };
      const synced = Object.assign({}, member, {
        name: member.name || '伊娃学员',
        wx_nickname: '微信学员',
        wx_avatar_url: '/images/logo-20261005.png',
        wx_profile_synced_at: new Date().toISOString()
      });
      simulatedMember = Object.assign({}, simulatedMember || {}, synced);
      localStorage.setItem('evaMiniPreviewMember', JSON.stringify(simulatedMember));
      profileData = Object.assign({}, profileData || {}, { member: synced });
      history.replaceState(null, '', '#profile');
      renderProfile();
    }
    function openWechatServicePreview(){
      alert('预览模式：这里会唤起微信客服系统。');
    }
    async function renderAdmin(){
      nav('小程序管理', true);
      let cfg = miniConfig;
      try { cfg = await api('/admin/miniprogram-config'); } catch (error) {}
      const s = cfg?.stats || {};
      const list = cfg?.system?.all || series;
      setContent('<section class="hero"><div><small>管理员</small><h1>小程序管理台</h1><p>所有统计和训练列表均来自后台数据库。</p></div></section><section class="stats card"><div><b>' + (s.published_series || 0) + '</b><span>上架训练</span></div><div><b>' + (s.authorizations || 0) + '</b><span>授权</span></div><div><b>' + (s.orders || 0) + '</b><span>订单</span></div><div><b>' + formatCompactMoney(s.paid_revenue || 0) + '</b><span>收入</span></div></section><h2>训练管理</h2>' + (list.slice(0, 12).map(item => '<section class="series card"><div class="cover">' + imageHtml(item.cover_image, item.category || '训练') + '</div><div class="info"><b>' + item.name + '</b><p class="muted">' + (item.category || '未分类') + ' · ' + (item.status || 'published') + '</p></div></section>').join('') || '<section class="empty card">暂无后台训练</section>'));
    }
    function renderCertificatesPage(){
      nav('我的证书', true);
      const certificates = Array.isArray(profileData?.certificates) ? profileData.certificates : [];
      if (!certificates.length) {
        setContent('<section class="empty card" style="padding:60px 20px;text-align:center"><div style="font-size:60px;margin-bottom:10px">📜</div><div style="font-size:16px;font-weight:900;color:#202124">暂无证书</div><div style="margin-top:8px;color:#8c8172;font-size:13px">完成学习后可获得对应课程证书</div></section>');
        return;
      }
      const html = certificates.map(cert => {
        const name = cert.courseName || cert.course_name || cert.name || '结业证书';
        const date = String(cert.issueDate || cert.issue_date || '').slice(0,10) || '待登记日期';
        const no = cert.certificateNo || cert.certificate_no || cert.certNo || '';
        return '<div class="certificate-item" style="display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid #f1f1f1"><div style="flex:0 0 auto;width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#fef3e6,#fae4ce);display:grid;place-items:center;font-size:24px">🏆</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:900;color:#202124">' + escapeHtml(name) + '</div><div style="margin-top:4px;color:#8c8172;font-size:12px">' + escapeHtml(date) + ' · ' + escapeHtml(no) + '</div></div><span style="flex:0 0 auto;padding:4px 14px;border-radius:999px;color:#ff5b45;background:#fff2ef;font-size:12px;font-weight:800">查看</span></div>';
      }).join('');
      setContent('<section class="card" style="overflow:hidden">' + html + '</section>');
    }

    function renderProfileEdit(){
      nav('个人资料', true);
      const member = profileData?.member || simulatedMember || { name: '未登录', phone: '' };
      const displayName = member.name || '伊娃学员';
      const map = { male:'男', female:'女' };
      const genderText = map[member.gender] || member.gender || '未设置';
      const levelText = formatMemberLevel(member.level);
      const avatarHtml = member.wx_avatar_url || member.avatar_url ? '<img src="' + escapeHtml(member.wx_avatar_url || member.avatar_url) + '" style="width:60px;height:60px;border-radius:10px;object-fit:cover">' : '<div style="width:60px;height:60px;border-radius:10px;background:#ff5b45;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900">' + (displayName.slice(0,1) || '伊') + '</div>';
      const fields = [
        { label:'学员等级', value:levelText, readonly:true },
        { label:'姓名', value:displayName },
        { label:'手机号', value:member.phone || '' },
        { label:'性别', value:genderText },
        { label:'生日', value:member.birthday || '' },
        { label:'省份', value:member.province || '' },
        { label:'城市', value:member.city || '' },
        { label:'注册日期', value:(member.created_at || member.registeredAt || '').slice(0,10) || '未记录', readonly:true }
      ];
      const formHtml = fields.map(f => {
        const valClass = f.readonly ? 'color:#8c8172' : 'color:#3e4652';
        return '<div style="display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 20px;border-bottom:1px solid #f0e6da"><span style="flex:0 0 110px;font-size:14px;font-weight:800;color:#202124">' + f.label + '</span><span style="font-size:14px;text-align:right;' + valClass + '">' + (f.value || '') + '</span></div>';
      }).join('');
      const avatarRow = '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px"><span style="font-size:14px;font-weight:800;color:#202124">头像</span>' + avatarHtml + '</div>';
      setContent('<section class="card">' + avatarRow + '</section><section class="card" style="margin-top:10px;overflow:hidden">' + formHtml + '</section><div style="text-align:center;padding:16px;color:#8c8172;font-size:12px">修改后点击其他地方即可自动保存</div>');
    }

    function goHome(){
      if (previewRoot === 'offline') return renderOffline();
      if (previewRoot === 'events') return renderEvents();
      return renderHome();
    }
    window.addEventListener('hashchange', routeFromHash);
    document.addEventListener('click', event => {
      const target = event.target.closest('button');
      if (!target) return;
      const action = target.dataset.action || target.id;
      const handlers = {
        tabHome: renderHome,
        tabOffline: renderOffline,
        tabEvents: renderEvents,
        tabPractice: renderPractice,
        tabCourses: renderCourses,
        tabProfile: renderProfile,
        profileEdit: renderProfileEdit,
        certificatesPage: renderCertificatesPage,
        login: renderLogin,
        logout: logoutPreview,
        profile: renderProfile,
        'bind-wechat': bindWechatPreview,
        'wechat-service': openWechatServicePreview,
        'official-home': openOfficialHome,
        'phone-auth-login': loginPreviewByPhoneAuth,

        'courses-recent': () => switchCoursesPanel('recent'),
        'courses-all': () => switchCoursesPanel('all')
      };
      if (handlers[action]) {
        event.preventDefault();
        handlers[action]();
      }
    });
    load();
  </script>
</body>
</html>
