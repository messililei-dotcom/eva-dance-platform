<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3"/>
      <stop offset="100%" style="stop-color:#e8d5c0"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bg)" stroke="#c4a882" stroke-width="2"/>
  
  <!-- 装饰图案 -->
  <circle cx="200" cy="110" r="50" fill="#d4c4b0"/>
  <circle cx="200" cy="110" r="25" fill="#e5d5c5"/>
  
  <!-- 文字 -->
  <text x="200" y="200" text-anchor="middle" font-family="serif" font-size="16" fill="#8a7060">课程图片</text>
  <text x="200" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a08070">课程视觉筹备中</text>
</svg>
