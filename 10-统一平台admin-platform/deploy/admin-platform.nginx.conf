upstream eva_admin_platform {
    server 127.0.0.1:3003;
    keepalive 64;
}

server {
    listen 80;
    server_name admin.dongfangwuquan.com api.dongfangwuquan.com auth.dongfangwuquan.com learn.dongfangwuquan.com;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/dongfangwuquan/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.dongfangwuquan.com api.dongfangwuquan.com auth.dongfangwuquan.com learn.dongfangwuquan.com;

    ssl_certificate /etc/letsencrypt/live/admin.dongfangwuquan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.dongfangwuquan.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:EvaAdminSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 5g;
    client_body_timeout 3600s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /_next/static/ {
        proxy_pass http://eva_admin_platform;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://eva_admin_platform;
        add_header Cache-Control "public, max-age=86400";
    }

    location /api/ {
        proxy_pass http://eva_admin_platform;
    }

    location /api/course/materials/upload-local {
        proxy_pass http://eva_admin_platform;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /learn/ {
        proxy_pass http://eva_admin_platform;
    }

    location /login {
        proxy_pass http://eva_admin_platform;
    }

    location / {
        proxy_pass http://eva_admin_platform;
    }
}
